---
# Deployment de Twilio Voice Server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twilio
  namespace: sctbnk-voice
  labels:
    app: twilio
spec:
  replicas: 3  # 3 réplicas para manejar llamadas concurrentes
  selector:
    matchLabels:
      app: twilio
  template:
    metadata:
      labels:
        app: twilio
    spec:
      containers:
      - name: twilio
        image: tu-registry/sctbnk-twilio:latest  # Cambiar por tu imagen
        ports:
        - containerPort: 5000
        envFrom:
        - secretRef:
            name: sctbnk-secrets
        env:
        - name: PORT
          value: "5000"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10

---
# Service de Twilio (LoadBalancer para IP pública)
apiVersion: v1
kind: Service
metadata:
  name: twilio-service
  namespace: sctbnk-voice
  annotations:
    # Para AWS
    # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # Para GCP
    # cloud.google.com/load-balancer-type: "External"
spec:
  selector:
    app: twilio
  ports:
    - protocol: TCP
      port: 443
      targetPort: 5000
  type: LoadBalancer  # Esto crea una IP pública

