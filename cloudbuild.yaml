# ============================================================
# Cloud Build Configuration - CI/CD Automático
# ============================================================
# Este archivo automatiza el build y deployment cuando
# se hace push a la rama 'main' o 'production'
# ============================================================

steps:
  # ============================================================
  # PASO 1: Build de Imagen Actions
  # ============================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-actions'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.actions'
      - '-t'
      - 'gcr.io/$PROJECT_ID/actions:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/actions:latest'
      - '.'
    waitFor: ['-']

  # ============================================================
  # PASO 2: Build de Imagen Twilio
  # ============================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-twilio'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.twilio'
      - '-t'
      - 'gcr.io/$PROJECT_ID/twilio:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/twilio:latest'
      - '.'
    waitFor: ['-']

  # ============================================================
  # PASO 3: Build de Imagen Rasa (el más lento)
  # ============================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-rasa'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.rasa'
      - '-t'
      - 'gcr.io/$PROJECT_ID/rasa:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/rasa:latest'
      - '.'
    waitFor: ['-']

  # ============================================================
  # PASO 4: Push de Imagen Actions
  # ============================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-actions'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/actions:$SHORT_SHA'
    waitFor: ['build-actions']

  # ============================================================
  # PASO 5: Push de Imagen Twilio
  # ============================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-twilio'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/twilio:$SHORT_SHA'
    waitFor: ['build-twilio']

  # ============================================================
  # PASO 6: Push de Imagen Rasa
  # ============================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-rasa'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/rasa:$SHORT_SHA'
    waitFor: ['build-rasa']

  # ============================================================
  # PASO 7: Deploy Actions Server
  # ============================================================
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-actions'
    args:
      - 'run'
      - 'deploy'
      - 'actions-server'
      - '--image=gcr.io/$PROJECT_ID/actions:$SHORT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--quiet'
    waitFor: ['push-actions']

  # ============================================================
  # PASO 8: Obtener URL de Actions (para Rasa)
  # ============================================================
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'get-actions-url'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        ACTIONS_URL=$(gcloud run services describe actions-server \
          --region=us-central1 \
          --format='value(status.url)')
        echo "ACTIONS_URL=$ACTIONS_URL" >> /workspace/env.txt
        echo "Actions Server URL: $ACTIONS_URL"
    waitFor: ['deploy-actions']

  # ============================================================
  # PASO 9: Deploy Rasa Server
  # ============================================================
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-rasa'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/env.txt
        gcloud run deploy rasa-server \
          --image=gcr.io/$PROJECT_ID/rasa:$SHORT_SHA \
          --region=us-central1 \
          --platform=managed \
          --allow-unauthenticated \
          --memory=2Gi \
          --cpu=2 \
          --timeout=300 \
          --set-env-vars RASA_PRO_LICENSE=$${_RASA_PRO_LICENSE},ACTION_SERVER_URL=$$ACTIONS_URL/webhook \
          --quiet
    waitFor: ['push-rasa', 'get-actions-url']
    secretEnv: ['RASA_PRO_LICENSE']

  # ============================================================
  # PASO 10: Obtener URL de Rasa (para Twilio)
  # ============================================================
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'get-rasa-url'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        RASA_URL=$(gcloud run services describe rasa-server \
          --region=us-central1 \
          --format='value(status.url)')
        echo "RASA_URL=$RASA_URL" >> /workspace/env.txt
        echo "Rasa Server URL: $RASA_URL"
    waitFor: ['deploy-rasa']

  # ============================================================
  # PASO 11: Obtener Connection Name de Cloud SQL
  # ============================================================
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'get-sql-connection'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        SQL_CONN=$(gcloud sql instances describe voicebot-db \
          --format='value(connectionName)')
        echo "SQL_CONNECTION=$SQL_CONN" >> /workspace/env.txt
        echo "SQL Connection: $SQL_CONN"
    waitFor: ['-']

  # ============================================================
  # PASO 12: Deploy Twilio Server
  # ============================================================
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-twilio'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/env.txt
        gcloud run deploy twilio-server \
          --image=gcr.io/$PROJECT_ID/twilio:$SHORT_SHA \
          --region=us-central1 \
          --platform=managed \
          --allow-unauthenticated \
          --memory=1Gi \
          --cpu=1 \
          --add-cloudsql-instances=$$SQL_CONNECTION \
          --set-env-vars \
            BASE_URL="TBD",\
            RASA_URL=$$RASA_URL/webhooks/rest/webhook,\
            DB_HOST=/cloudsql/$$SQL_CONNECTION,\
            DB_PORT=3306,\
            DB_USER=root,\
            DB_PASSWORD=$${_DB_PASSWORD},\
            DB_NAME=bank,\
            ELEVEN_API_KEY=$${_ELEVEN_API_KEY},\
            ELEVEN_VOICE_ID=$${_ELEVEN_VOICE_ID},\
            ELEVEN_VOICE_ID2=$${_ELEVEN_VOICE_ID2},\
            FRESHDESK_API_KEY=$${_FRESHDESK_API_KEY},\
            FRESHDESK_DOMAIN=$${_FRESHDESK_DOMAIN} \
          --quiet
    waitFor: ['push-twilio', 'get-rasa-url', 'get-sql-connection']
    secretEnv: ['DB_PASSWORD', 'ELEVEN_API_KEY', 'ELEVEN_VOICE_ID', 'ELEVEN_VOICE_ID2', 'FRESHDESK_API_KEY', 'FRESHDESK_DOMAIN']

  # ============================================================
  # PASO 13: Actualizar BASE_URL de Twilio
  # ============================================================
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'update-base-url'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        TWILIO_URL=$(gcloud run services describe twilio-server \
          --region=us-central1 \
          --format='value(status.url)')
        gcloud run services update twilio-server \
          --region=us-central1 \
          --update-env-vars BASE_URL=$$TWILIO_URL \
          --quiet
        echo "Twilio Server URL: $TWILIO_URL"
    waitFor: ['deploy-twilio']

# ============================================================
# CONFIGURACIÓN
# ============================================================
options:
  machineType: 'E2_HIGHCPU_8'  # Máquina más rápida para builds
  logging: CLOUD_LOGGING_ONLY

# Secrets desde Secret Manager
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/rasa-pro-license/versions/latest
      env: 'RASA_PRO_LICENSE'
    - versionName: projects/$PROJECT_ID/secrets/db-password/versions/latest
      env: 'DB_PASSWORD'
    - versionName: projects/$PROJECT_ID/secrets/eleven-api-key/versions/latest
      env: 'ELEVEN_API_KEY'
    - versionName: projects/$PROJECT_ID/secrets/eleven-voice-id/versions/latest
      env: 'ELEVEN_VOICE_ID'
    - versionName: projects/$PROJECT_ID/secrets/eleven-voice-id2/versions/latest
      env: 'ELEVEN_VOICE_ID2'
    - versionName: projects/$PROJECT_ID/secrets/freshdesk-api-key/versions/latest
      env: 'FRESHDESK_API_KEY'
    - versionName: projects/$PROJECT_ID/secrets/freshdesk-domain/versions/latest
      env: 'FRESHDESK_DOMAIN'

# Timeout: 30 minutos (Rasa build es lento)
timeout: '1800s'

# Imágenes a guardar
images:
  - 'gcr.io/$PROJECT_ID/actions:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/actions:latest'
  - 'gcr.io/$PROJECT_ID/twilio:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/twilio:latest'
  - 'gcr.io/$PROJECT_ID/rasa:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/rasa:latest'

