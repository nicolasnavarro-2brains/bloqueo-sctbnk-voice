version: "3.1"

rules:
  - rule: Activar flujo de bloqueo de tarjeta
    steps:
      - intent: bloquear_tarjeta
      - action: flow_bloqueo_tarjeta

  - rule: Activar flujo desde quiero bloquear
    steps:
      - intent: quiero_bloquear_tarjeta
      - action: flow_bloqueo_tarjeta

  - rule: Activar flujo de bloqueo de tarjeta desde saludo
    steps:
      - intent: saludar
      - action: flow_bloqueo_tarjeta