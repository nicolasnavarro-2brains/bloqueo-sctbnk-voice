version: "3.1"

nlu:
# 1. Bienvenida
- intent: saludar
  examples: |
    - hola
    - buenos días
    - buenas tardes
    - buenas noches
    - saludos
    - hey
    - oye

# 2. Autenticación por RUT
- intent: ingresar_rut
  examples: |
    - mi RUT es [123456789](rut)
    - es [987654321](rut)
    - [112223334](rut)
    - [556667778](rut)
    - mi RUT es [223334445](rut)
    - RUT: [334445556](rut)

# 6. Selección Bloqueo de Tarjeta
- intent: bloquear_tarjeta
  examples: |
    - necesito bloquear mi tarjeta
    - quiero bloquear mi tarjeta
    - mi tarjeta fue robada
    - perdí mi tarjeta
    - bloquea mi tarjeta

# 7. Selección de Tarjeta
- intent: proporcionar_digitos
  examples: |
    - es la [1234](digitos)
    - son los [5678](digitos)
    - [9012](digitos)
    - la tarjeta [3456](digitos)
    - [7890](digitos)

# 9. Confirmación de Bloqueo
- intent: confirmar_bloqueo
  examples: |
    - sí
    - correcto
    - adelante
    - procede
    - confirmo

# 9.1 Cancelación de Bloqueo
- intent: cancelar_bloqueo
  examples: |
    - no
    - cancelar
    - detener
    - espera
    - no, cancela

# Confirmar generación de ticket
- intent: confirmar_generacion
  examples: |
    - procede con la generación
    - sí, genera el ticket

# Despedida
- intent: despedida
  examples: |
    - adiós
    - hasta luego
    - chao
    - gracias
