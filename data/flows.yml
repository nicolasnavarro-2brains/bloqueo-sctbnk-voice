version: "3.1"

flows:
  bloqueo_tarjeta:
    description: "Flujo para bloquear tarjeta del cliente"
    steps:
      - id: recolectar_digitos
        collect: digitos
        description: "los últimos 4 dígitos de la tarjeta a bloquear"
        next: verificar_tarjeta

      - id: verificar_tarjeta
        action: action_verificar_tarjeta
        next:
          - if: slots.tarjeta_valida == true
            then: tarjeta_valida
          - else: tarjeta_invalida

      - id: tarjeta_invalida
        action: utter_tarjeta_invalida_reintentar
        next: limpiar_digitos
      
      - id: limpiar_digitos
        set_slots:
          - digitos: null
        next: recolectar_digitos

      - id: tarjeta_valida
        action: action_preguntar_confirmacion
        next: esperar_confirmacion
      
      - id: esperar_confirmacion
        collect: confirmar_bloqueo
        next:
          - if: slots.confirmar_bloqueo == true
            then: generar_ticket
          - else: cancelar_bloqueo
      
      - id: generar_ticket
        action: action_generar_ticket
        next: despedida
      
      - id: despedida
        action: action_despedida_contextual
      
      - id: cancelar_bloqueo
        action: action_bloqueo_cancelado